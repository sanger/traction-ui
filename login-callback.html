<!-- Okta callback redirect script -->
<!--
On this callback page:

    call token.parseFromUrl to retrieve tokens
    Add tokens to the TokenManager: tokenManager.setTokens

Read saved route and redirect to it: getOriginalUri
 -->
<!doctype html>
<html>
  <head>
    <script type="module">
      import oktaAuth from './src/lib/auth.js'

      const redirectAfterSuccess = window.location.origin + '/#/'

      // parse tokens from the url
      oktaAuth.token
        .parseFromUrl()
        .then(function (tokens) {
          // add tokens to the tokenManager
          for (var t = 0; t < tokens.length; t++) {
            var token = tokens[t]
            if (token.idToken) {
              oktaAuth.tokenManager.add('idToken', token)
            } else if (token.accessToken) {
              oktaAuth.tokenManager.add('accessToken', token)
            }
          }

          const originalUri = oktaAuth.getOriginalUri()

          window.location = redirectAfterSuccess + originalUri;
        })
        .catch(function (err) {
          // handle the error
          console.error(err)
          // If OAuth error, display the error message as an appended paragraph in the page
          if (err.errorCode) {
            const errorMessage = document.createElement('p')
            errorMessage.textContent = `Error: ${err.errorSummary}`
            document.body.appendChild(errorMessage)
          }
        })
    </script>
  </body>
</html>
